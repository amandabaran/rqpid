# Cluster profile — r320 nodes with mlx4 ConnectX-3, InfiniBand transport
# Set values by consulting `ibv_devinfo` (see README).

# ---- RDMA transport (patched into all RdmaVerbs.h) ----
NET_DEV_NAME="enp8s0d1"      # Ethernet iface with private-subnet IP
IB_DEV_NAME_IDX="0"          # char at idx 5 of RDMA device name (mlx4_0 -> '0')
MLX_PORT=1                   # 1-indexed port on the RDMA device
GID_INDEX=0                  # RoCE v2 IPv4 index, or 0 for InfiniBand

# ---- Memory sizing (patched into RdmaConfig.h and test bins) ----
RDMA_BUFFER_GB=2             # per-process RDMA cache (was 32 on r650)
DSM_GB=2                     # per-MS DSM size (was 8 on r650)
LEAF_POOL_MB=512            # per-MS leaf slab (was 2048 on r650)
HUGEPAGES=3000               # per-node 2MB huge pages (was 51200 on r650)
MAX_THREAD_NUM=4

# ---- Network / OOB ----
MEMCACHED_HOST="10.10.1.1"
MEMCACHED_PORT=18888

# ---- Reference table (do not edit) ---------------------------------
# | Hardware                | ETH iface   | Link | DEV_IDX | PORT | GID | RDMA_BUF | DSM | HUGEPAGES |
# |-------------------------|-------------|------|---------|------|-----|----------|-----|-----------|
# | r650 (ConnectX-6) RoCEv2 | ens1f1np1  | Eth  | '2'     | 1    | 3   | 32       | 8   | 51200     |
# | r320 (ConnectX-3) IB     | enp8s0d1   | IB   | '0'     | 1    | 0   | 4        | 4   | 6000      |